# nginx in front of node-express (installed as /etc/nginx/nginx.conf by scripts/server/install_app.sh).
# Reverse proxy to the app on 127.0.0.1:3001 over keep-alive connections, and a 1 s cache for GET /posts (global
# feed, every page; key = full request URI). The app itself has no cache. No gzip, no access log. Everything else is
# nginx 1.24 defaults (listen backlog 511, like Node).
#
# Cache behaviour: the first request for a key waits for the app (proxy_cache_lock: concurrent misses share one
# upstream request). After 1 s the entry is stale: nginx keeps serving it while ONE background request refreshes it
# (use_stale updating + background_update), so no feed request waits for a refresh. Maximum staleness = 1 s + refresh
# time. Without background_update, lock waiters poll every 500 ms, which would add up to 0.5 s per refresh.
#
# Server-Timing: misses pass the app's header through; hits (served by nginx alone) get zeros, because the app did no
# work for them; their whole latency shows up as "outside the app".

user www-data;
worker_processes 1;                 # 1 vCPU
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;       # 1 client socket per VU + 1 upstream socket per in-flight request
}

http {
    access_log off;
    server_tokens off;

    # k6 VUs keep their connection open for the whole run.
    keepalive_timeout 75s;
    keepalive_requests 1000000;

    upstream app {
        server 127.0.0.1:3001;
        keepalive 512;              # idle upstream connections kept open
        keepalive_requests 1000000;
        keepalive_timeout 4s;       # below Node's 5 s keepAliveTimeout, so nginx never reuses a closing socket
    }

    # Cache files live in tmpfs (RAM): a few keys of ~10 KB each.
    proxy_cache_path /dev/shm/nginx-feed levels=1 keys_zone=feed:1m max_size=16m inactive=60s use_temp_path=off;

    # App timing for misses, zeros for responses served from the cache.
    map $upstream_http_server_timing $server_timing {
        ""      "conn;dur=0.0, db;dur=0.0, app;dur=0.0, total;dur=0.0";
        default $upstream_http_server_timing;
    }

    # Feed requests that reached the app (MISS / EXPIRED = refresh); hits are not logged. Hit-rate evidence.
    map $upstream_cache_status $feed_upstream {
        HIT      0;
        UPDATING 0;
        STALE    0;
        default  1;
    }
    log_format feed '$msec $upstream_cache_status $request_uri $status';

    server {
        listen 3000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        location / {
            proxy_pass http://app;
        }

        location = /posts {
            proxy_pass http://app;
            proxy_cache feed;
            proxy_cache_methods GET HEAD;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating;
            proxy_cache_background_update on;
            proxy_hide_header Server-Timing;
            add_header Server-Timing $server_timing always;
            add_header X-Cache $upstream_cache_status always;
            access_log /var/log/nginx/feed_upstream.log feed if=$feed_upstream;
        }
    }
}
