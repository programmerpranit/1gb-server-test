# nginx in front of node-express (installed as /etc/nginx/nginx.conf by scripts/server/install_app.sh).
# Plain reverse proxy: every request goes to the app on 127.0.0.1:3001 over keep-alive connections.
# No cache, no gzip, no access log. Everything else is nginx 1.24 defaults (listen backlog 511, like Node).

user www-data;
worker_processes 1;                 # 1 vCPU
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 16384;       # 1 client socket per VU + 1 upstream socket per in-flight request
}

http {
    access_log off;
    server_tokens off;

    # k6 VUs keep their connection open for the whole run.
    keepalive_timeout 75s;
    keepalive_requests 1000000;

    upstream app {
        server 127.0.0.1:3001;
        keepalive 512;              # idle upstream connections kept open
        keepalive_requests 1000000;
        keepalive_timeout 4s;       # below Node's 5 s keepAliveTimeout, so nginx never reuses a closing socket
    }

    server {
        listen 3000;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
