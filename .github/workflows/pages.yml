# Publishes the reports to GitHub Pages: index.html (all configurations) + results/<tag>/report.html.
# Built by scripts/pages_site.py from committed results only; runs when release.sh pushes results.
name: pages

on:
  push:
    branches: [main]
    paths: ['results/**', 'scripts/pages_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/pages_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
